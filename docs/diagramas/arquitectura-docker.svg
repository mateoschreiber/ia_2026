<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" role="img" aria-labelledby="title desc">
  <title id="title">Construcción y ejecución del observatorio</title>
  <desc id="desc">Node compila la interfaz; la imagen Python contiene FastAPI, los gráficos compilados y el dataset inicial. El navegador accede por el puerto local 8000. El volumen energia_data conserva la base editable y los modelos cuando el contenedor se reemplaza.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7c98ac" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="432" rx="12" fill="#f3f6f9"/>
  <g font-family="Arial,sans-serif">
    <text x="28" y="33" font-size="14" font-weight="700" fill="#526b7d" letter-spacing="2">UN SERVICIO · DOS ETAPAS DE CONSTRUCCIÓN · DATOS PERSISTENTES</text>
    <rect x="28" y="60" width="270" height="132" rx="6" fill="white" stroke="#ccdce7"/>
    <text x="48" y="89" font-size="13" font-weight="700" fill="#d71920">CONSTRUCCIÓN</text>
    <text x="48" y="119" font-size="22" font-weight="700" fill="#163c57">Node 22 + Vite</text>
    <text x="48" y="148" font-size="16" fill="#526b7d">React / TypeScript / ECharts</text>
    <text x="48" y="173" font-size="16" fill="#526b7d">Produce archivos del frontend</text>
    <path d="M307 126H347" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="358" y="60" width="454" height="210" rx="6" fill="white" stroke="#8daec4" stroke-width="1.5"/>
    <rect x="358" y="60" width="454" height="5" fill="#003b71"/>
    <text x="380" y="92" font-size="13" font-weight="700" fill="#d71920">CONTENEDOR / SERVICIO energia</text>
    <text x="380" y="123" font-size="22" font-weight="700" fill="#163c57">Python 3.12 + FastAPI + Uvicorn</text>
    <text x="380" y="154" font-size="16" fill="#526b7d">Frontend compilado + API + inferencia</text>
    <text x="380" y="183" font-size="16" fill="#526b7d">Dataset de ejemplo incluido en la imagen</text>
    <text x="380" y="214" font-size="16" fill="#526b7d">Primer arranque: inicializa y entrena</text>
    <text x="380" y="243" font-size="16" fill="#526b7d">Después: carga el modelo persistido</text>
    <path d="M822 154H872" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="884" y="93" width="288" height="148" rx="6" fill="#003b71"/>
    <text x="905" y="126" font-size="13" font-weight="700" fill="#c9e0ef">NAVEGADOR DEL EQUIPO</text>
    <text x="905" y="163" font-size="23" font-weight="700" fill="white">localhost:8000</text>
    <text x="905" y="193" font-size="16" fill="#d5e6ef">UI y API en una dirección</text>
    <text x="905" y="220" font-size="16" fill="#d5e6ef">Acceso ligado a 127.0.0.1</text>
    <path d="M585 280V305" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="358" y="318" width="454" height="85" rx="6" fill="#e5eff6" stroke="#bed2e0"/>
    <text x="380" y="347" font-size="19" font-weight="700" fill="#163c57">Volumen energia_data → /app/runtime</text>
    <text x="380" y="378" font-size="16" fill="#526b7d">JSON editable + modelos + métricas + respaldo</text>
    <text x="28" y="337" font-size="16" font-weight="700" fill="#163c57">Reconstruir la imagen</text>
    <text x="28" y="363" font-size="16" fill="#526b7d">no borra este volumen.</text>
    <text x="884" y="337" font-size="16" font-weight="700" fill="#163c57">El laboratorio es temporal</text>
    <text x="884" y="363" font-size="16" fill="#526b7d">No escribe datos ni reentrena.</text>
  </g>
</svg>
