<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 244" role="img" aria-labelledby="title desc">
  <title id="title">Del equipo vacío a la aplicación funcionando</title>
  <desc id="desc">Cuatro pasos: preparar Docker en el sistema operativo, descargar el repositorio, ejecutar Docker Compose y abrir localhost en el navegador.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7c98ac" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="244" rx="12" fill="#f3f6f9"/>
  <text x="28" y="34" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#526b7d" letter-spacing="2">RUTA DE DESPLIEGUE</text>
  <g font-family="Arial,sans-serif">
    <rect x="28" y="57" width="258" height="145" rx="6" fill="white" stroke="#ccdce7"/>
    <rect x="28" y="57" width="4" height="145" fill="#003b71"/>
    <text x="49" y="86" font-size="13" fill="#d71920" font-weight="700">01 / PREPARAR</text>
    <text x="49" y="115" font-size="21" fill="#163c57" font-weight="700">Docker y Compose</text>
    <text x="49" y="143" font-size="16" fill="#526b7d">Windows / macOS: Desktop</text>
    <text x="49" y="169" font-size="16" fill="#526b7d">Linux: Engine + plugin</text>
    <path d="M294 129H318" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="326" y="57" width="250" height="145" rx="6" fill="white" stroke="#ccdce7"/>
    <text x="347" y="86" font-size="13" fill="#d71920" font-weight="700">02 / DESCARGAR</text>
    <text x="347" y="115" font-size="21" fill="#163c57" font-weight="700">Repositorio</text>
    <text x="347" y="143" font-size="16" fill="#526b7d">Clonar con Git o extraer ZIP</text>
    <text x="347" y="169" font-size="16" fill="#526b7d">Terminal en la raíz ia_2026</text>
    <path d="M584 129H608" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="616" y="57" width="264" height="145" rx="6" fill="white" stroke="#ccdce7"/>
    <text x="637" y="86" font-size="13" fill="#d71920" font-weight="700">03 / CONSTRUIR E INICIAR</text>
    <text x="637" y="115" font-size="21" fill="#163c57" font-weight="700">Docker Compose</text>
    <text x="637" y="143" font-size="16" fill="#526b7d">up --build -d</text>
    <text x="637" y="169" font-size="16" fill="#526b7d">Esperar la API: estado ok</text>
    <path d="M888 129H912" stroke="#7c98ac" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="920" y="57" width="252" height="145" rx="6" fill="#003b71"/>
    <text x="941" y="86" font-size="13" fill="#c9e0ef" font-weight="700">04 / EXPLORAR</text>
    <text x="941" y="115" font-size="21" fill="white" font-weight="700">localhost:8000</text>
    <text x="941" y="143" font-size="16" fill="#d5e6ef">Dashboard y laboratorio</text>
    <text x="941" y="169" font-size="16" fill="#d5e6ef">Datos y modelos locales</text>
  </g>
  <text x="28" y="228" font-family="Arial,sans-serif" font-size="13" fill="#526b7d">No hace falta instalar Python ni Node en el equipo para la ruta de Docker.</text>
</svg>
